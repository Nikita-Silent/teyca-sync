services:
  migrate:
    build: .
    environment:
      LOG_COMPONENT: migrate
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    command: alembic upgrade head
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_COMPONENT: app
      HEARTBEAT_DIR: /var/run/teyca-sync
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - heartbeat-data:/var/run/teyca-sync
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import os, urllib.request; path = os.environ.get("WEBHOOK", "/webhook").strip() or "/webhook"; path = path if path.startswith("/") else f"/{path}"; urllib.request.urlopen(f"http://127.0.0.1:8000{path}/live", timeout=5)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build: .
    environment:
      LOG_COMPONENT: worker
      HEARTBEAT_DIR: /var/run/teyca-sync
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - heartbeat-data:/var/run/teyca-sync
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.workers.run_worker
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import asyncio; from app.service_health import all_worker_heartbeats_fresh; raise SystemExit(0 if asyncio.run(all_worker_heartbeats_fresh()) else 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  heartbeat-data:
    name: ${HEARTBEAT_VOLUME_NAME:-teyca-sync_heartbeat-data}
