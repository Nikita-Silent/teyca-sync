[project]
name = "teyca-sync"
version = "0.1.0"
description = "Webhook-to-RabbitMQ sync service for Teyca CRM loyalty"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "aio-pika>=9.6.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "requests>=2.34.2",
    "python-logging-loki-v2==1.1.1",
    "listmonk>=0.4.3",
    "dnspython>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "testcontainers>=4.14.2",
    "basedpyright>=1.39.9",
    "pytest-cov>=7.1.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "refurb>=2.3.1",
    "bandit>=1.9.4",
    "interrogate>=1.7.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "lefthook>=2.1.9",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "service_workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/1620d633d874_add_referal_and_tags_to_users.py" = ["E501", "I001", "UP007", "UP035"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/**/__pycache__/*",
    "app/workers/run_*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.vulture]
exclude = [
    ".venv",
    ".git",
    "migrations/versions",
]
min_confidence = 80
paths = ["app", "tests"]
sort_by_size = true

[tool.deptry]
known_first_party = ["app", "service_workers"]
optional_dependencies_dev_groups = ["dev"]
extend_exclude = [
    "migrations/versions",
]

[tool.deptry.package_module_name_map]
"aio-pika" = "aio_pika"
"pydantic-settings" = "pydantic_settings"
"python-logging-loki-v2" = "logging_loki"

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "asyncpg", "uvicorn"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations/versions"]
skips = []

[tool.interrogate]
fail-under = 80
exclude = ["setup.py", "docs", "migrations"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = false
ignore-semiprivate = false
verbose = 1
